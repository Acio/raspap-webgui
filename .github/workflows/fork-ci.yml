# CI of the hardened fork: runs the test suites of tests/fork in Debian 13
# containers. Read-only token, no secrets.
name: Fork CI
on:
  push:
    branches: [pi/hardened]
  pull_request:
    branches: [pi/hardened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [static, firewall, plugins, update, smallbugs, restapi, hardening]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the ${{ matrix.suite }} suite
        run: bash tests/fork/run.sh "${{ matrix.suite }}"
